name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.console=plain

jobs:
  core:
    name: Núcleo (JVM) — build + 219 testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build e testes do módulo core (sem Android SDK)
        run: ./gradlew -PcoreOnly :core:build

      - name: Relatório de testes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-test-report
          path: core/build/reports/tests/test
          if-no-files-found: ignore

  resources:
    name: Recursos Android — consistência estática
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Strings pt-BR ⇄ en, ids de ViewBinding, referências R.*
        run: python3 scripts/check_resources.py

  app:
    name: App Android — assemble, lint, testes unitários
    runs-on: ubuntu-latest
    needs: [core, resources]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Testes unitários do app
        run: ./gradlew :app:testDebugUnitTest

      - name: Lint (falha em erros)
        run: ./gradlew :app:lintDebug

      - name: APK de debug
        run: ./gradlew :app:assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v7
        with:
          name: android-java-lab-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publicar relatório do lint
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
